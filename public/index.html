<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密钥验证</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        /* 模态窗口背景 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>
    <script src="/data-store.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm mx-auto">
        <div id="page1" class="page active bg-white p-8 rounded-2xl shadow-lg text-center">
            <div class="mb-6">
                 <h1 class="text-2xl font-bold text-gray-800">密钥验证</h1>
                 <p class="text-gray-500 text-sm mt-1">请输入您的密钥以继续</p>
            </div>
             <div class="space-y-4 text-left">
                <div>
                    <label for="keyId" class="block text-sm font-medium text-gray-700">密钥</label>
                    <input type="text" id="keyId" placeholder="在此粘贴您的密钥" class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 text-base" required>
                </div>
                <button id="validateBtn" class="w-full bg-blue-500 text-white font-semibold py-3 px-4 rounded-xl hover:bg-blue-600 transition duration-150 ease-in-out">
                    验证密钥
                </button>
                
                <button id="contactCustomerServiceBtn1" class="w-full bg-gray-200 text-gray-700 font-semibold py-3 px-4 rounded-xl hover:bg-gray-300 transition duration-150 ease-in-out">
                    联系客服
                </button>

                <p id="validationStatus" class="text-sm text-red-500 h-5 text-center mt-2"></p>
            </div>
        </div>

        <div id="page2" class="page bg-white p-8 rounded-2xl shadow-lg text-center">
            <svg class="w-16 h-16 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h2 class="text-xl font-bold text-gray-800 mb-2">密钥验证成功!</h2>
            <p id="successMessage" class="text-gray-600 mb-4"></p>
            
            <div class="space-y-3">
                <button id="getFeishuBtn" class="w-full bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl hover:bg-indigo-600 transition duration-150 ease-in-out">
                    获取飞书模板 (Feishu)
                </button>
                <button id="getShortcutBtn" class="w-full bg-orange-500 text-white font-semibold py-3 px-4 rounded-xl hover:bg-orange-600 transition duration-150 ease-in-out">
                    获取快捷指令 (Shortcut)
                </button>
                <button id="backBtn" class="w-full bg-gray-300 text-gray-800 font-semibold py-3 px-4 rounded-xl hover:bg-gray-400 transition duration-150 ease-in-out">
                    返回
                </button>
            </div>
        </div>
        
        <div id="page3" class="page bg-white p-8 rounded-2xl shadow-lg text-center">
             <svg class="w-16 h-16 text-red-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h2 class="text-xl font-bold text-gray-800 mb-2">验证失败</h2>
            <p id="failureMessage" class="text-gray-600 mb-4"></p>
            
            <div class="space-y-3">
                <button id="backToInputBtn" class="w-full bg-gray-300 text-gray-800 font-semibold py-3 px-4 rounded-xl hover:bg-gray-400 transition duration-150 ease-in-out">
                    重新输入
                </button>
                <button id="contactCustomerServiceBtn2" class="w-full bg-gray-200 text-gray-700 font-semibold py-3 px-4 rounded-xl hover:bg-gray-300 transition duration-150 ease-in-out">
                    联系客服
                </button>
            </div>
        </div>

    </div>
    
    <div id="customerServiceModal" class="modal-overlay">
        <div class="bg-white p-6 rounded-2xl shadow-xl max-w-xs w-full text-center">
            <h3 class="text-xl font-bold mb-4 text-gray-800">联系客服</h3>
            <img src="/public/image_e48c24.png" alt="微信客服二维码" class="mx-auto w-48 h-48 mb-4">
            <p class="text-sm text-gray-600 mb-4">请使用微信扫描上方二维码</p>
            <button id="closeModalBtn" class="w-full bg-red-500 text-white font-semibold py-2 px-4 rounded-xl hover:bg-red-600 transition duration-150 ease-in-out">
                关闭
            </button>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM 元素获取 ---
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const page3 = document.getElementById('page3');
            const keyInput = document.getElementById('keyId');
            const validateBtn = document.getElementById('validateBtn');
            const validationStatus = document.getElementById('validationStatus');
            const successMessage = document.getElementById('successMessage');
            const failureMessage = document.getElementById('failureMessage');
            const backBtn = document.getElementById('backBtn');
            const backToInputBtn = document.getElementById('backToInputBtn');
            const getFeishuBtn = document.getElementById('getFeishuBtn');
            const getShortcutBtn = document.getElementById('getShortcutBtn');

            // --- 客服相关 DOM ---
            const customerServiceModal = document.getElementById('customerServiceModal');
            const contactCustomerServiceBtn1 = document.getElementById('contactCustomerServiceBtn1');
            const contactCustomerServiceBtn2 = document.getElementById('contactCustomerServiceBtn2');
            const closeModalBtn = document.getElementById('closeModalBtn');

            let currentPage = page1;

            // --- 页面切换函数 ---
            const showPage = (targetPage) => {
                if (currentPage) {
                    currentPage.classList.remove('active');
                    currentPage.style.display = 'none';
                }
                targetPage.classList.add('active');
                targetPage.style.display = 'block';
                currentPage = targetPage;
            };

            // --- 客服模态窗口控制函数 ---
            const showCustomerServiceModal = () => {
                customerServiceModal.style.display = 'flex';
            };

            const hideCustomerServiceModal = () => {
                customerServiceModal.style.display = 'none';
            };


            // --- 事件监听器 ---
            validateBtn.addEventListener('click', async () => {
                const key = keyInput.value.trim();
                if (!key) {
                    validationStatus.textContent = '请输入密钥';
                    return;
                }
                
                validationStatus.textContent = '';
                validateBtn.disabled = true;
                validateBtn.textContent = '验证中...';

                try {
                    const result = await DataStore.validateKey(key);

                    if (result.success) {
                        successMessage.innerHTML = result.message + '<br>' + 
                            `类型：<span class="font-semibold">${result.data.key_type === 'permanent' ? '永久密钥' : '试用密钥'}</span>`;
                        showPage(page2);
                    } else {
                        // 验证失败
                        failureMessage.textContent = result.message || '密钥验证失败。';
                        showPage(page3);
                    }

                } catch (error) {
                    // API/网络错误
                    failureMessage.textContent = error.message.includes('409') 
                        ? '此密钥已被使用，如需再次验证，请联系管理员重置。' 
                        : '网络错误，请稍后重试';
                    showPage(page3);
                } finally {
                    validateBtn.disabled = false;
                    validateBtn.textContent = '验证密钥';
                }
            });

            // 页面 2 返回
            backBtn.addEventListener('click', () => {
                keyInput.value = '';
                showPage(page1);
            });

            // 页面 3 返回
            backToInputBtn.addEventListener('click', () => {
                keyInput.value = '';
                showPage(page1);
            });
            
            // 绑定客服按钮事件
            contactCustomerServiceBtn1.addEventListener('click', showCustomerServiceModal);
            contactCustomerServiceBtn2.addEventListener('click', showCustomerServiceModal);
            closeModalBtn.addEventListener('click', hideCustomerServiceModal);
            
            // 点击模态窗口外部区域关闭
            customerServiceModal.addEventListener('click', (e) => {
                if (e.target === customerServiceModal) {
                    hideCustomerServiceModal();
                }
            });


            // 辅助函数，用于获取公开配置链接
            const getConfigAndOpen = async (linkType) => {
                try {
                    // 调用 /api/config 获取公开配置
                    const result = await DataStore.getConfig();
                    let link = null;
                    if (linkType === 'feishu') {
                        link = result.data.FEISHU_TEMPLATE_LINK;
                    } else if (linkType === 'shortcut') {
                        link = result.data.SHORTCUT_ICLOUD_LINK;
                    }

                    if (link) {
                        window.open(link, '_blank');
                    } else {
                        alert(`管理员尚未配置${linkType === 'feishu' ? '飞书' : '快捷指令'}链接。`);
                    }
                } catch(error) {
                    alert(`获取链接失败: ${error.message}`);
                }
            };


            getFeishuBtn.addEventListener('click', () => getConfigAndOpen('feishu'));
            getShortcutBtn.addEventListener('click', () => getConfigAndOpen('shortcut'));
        });
    </script>
</body>
</html>
